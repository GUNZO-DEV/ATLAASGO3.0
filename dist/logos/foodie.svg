  <ellipse cx="100" cy="72" rx="58" ry="30" fill="#F5A623"/>
  <ellipse cx="100" cy="68" rx="55" ry="26" fill="#F7B733"/>
  <!-- Sesame seeds -->
  <ellipse cx="85" cy="62" rx="5" ry="3" fill="#E8960A" transform="rotate(-20 85 62)"/>
  <ellipse cx="100" cy="58" rx="5" ry="3" fill="#E8960A"/>
